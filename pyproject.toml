[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "context-engineering-lab"
version = "0.1.0"
description = "Context engineering lab: budget allocator, compaction, tool-result pruning, scratch offloading, agent deltas and a bounded critic loop, measured accuracy vs tokens"
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.17.1"]

[project.scripts]
ctxeng = "ctxeng.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S105", "S106", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
